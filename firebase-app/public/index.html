        </div>

      <div class="nav-group" data-group="riscos">

          <a href="#riscos" class="nav-link" data-page="riscos">Registro de Riscos</a>
          <a href="#monitor" class="nav-link" data-page="monitor">Risco no Tempo</a>

      <div class="nav-group" data-group="indicadores">

        <div class="nav-dropdown">
          <a href="#indicadores-cadastro" class="nav-link" data-page="indicadores-cadastro">Cadastro</a>
          <a href="#indicadores-dashboard" class="nav-link" data-page="indicadores-dashboard">Dashboard</a>

      </div>
      <div class="nav-group" data-group="fornecedores">

          <a href="#fornecedores-categorias" class="nav-link" data-page="fornecedores-categorias">Categorias</a>

  <div id="app"></div>
  <div class="toast" id="toast"></div>

  <script src="config.js?v=7"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- DOMPurify 3.4.15 (Apache-2.0), servido do próprio domínio: sem depender
       de CDN externo e sem ficar sujeito a uma indisponibilidade de terceiro. -->
  <script src="vendor/purify-3.4.15.min.js?v=1"></script>
  <script src="sanitizar-pcn.js?v=1"></script>
  <script src="util.js?v=2"></script>
  <script src="perfis.js?v=3"></script>
  <script src="criticidade.js?v=2"></script>
  <script src="fornecedor-score.js?v=2"></script>
  <script src="fornecedor-criticidade.js?v=4"></script>
  <script src="risco-consolidado.js?v=4"></script>
  <script src="api-legacy.js?v=6"></script>
  <script src="api.js?v=35"></script>
  <script>
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const DOMINIO = 'fortestecnologia.com.br';
    auth.onAuthStateChanged(async user => {
      if (!user || !user.email.endsWith('@' + DOMINIO)) {
        auth.signOut();
        window.location.href = '/login.html';
        return;
      }
      // Buscar perfil do usuario direto do Firestore (config_perfis + Áreas)
      window.USER_EMAIL = user.email;
      try {
        const perfil = await API.getPerfil(user.email);
        // RBAC cumulativo: USER_PERFIS e a lista; USER_PERFIL (string) segue
        // existindo = perfis[0], por compat com codigo que le um valor so.
        window.USER_PERFIS = Perfis.normalizarLista(perfil.perfis != null ? perfil.perfis : perfil.perfil);
        window.USER_PERFIL = window.USER_PERFIS[0];
        window.USER_AREA = perfil.area || null;
      } catch(e) {
        // Falha ao ler o perfil cai no MENOR acesso, nunca no maior.
        console.error('Falha ao carregar perfil, assumindo o menor acesso:', e);
        window.USER_PERFIS = [Perfis.PERFIL_PADRAO];
        window.USER_PERFIL = Perfis.PERFIL_PADRAO;
        window.USER_AREA = null;
      }
      // Aplicar restricoes de perfil.
      //
      // O menu e montado pelo que o perfil PODE ver (perfis.js), nao por uma
      // lista do que esconder. A lista de esconder deixou passar Processos,
      // PCNs, Riscos e Indicadores para o perfil de fornecedores: ela erra por
      // omissao, e tela nova nascia visivel para todo mundo.
      if (!Perfis.ehAdmin(window.USER_PERFIL)) {
        document.querySelectorAll('.nav-link[data-page]').forEach(el => {
          if (!Perfis.podeVerTela(window.USER_PERFIL, el.dataset.page)) el.style.display = 'none';
        });
        // Esconder grupos do menu que ficaram sem nenhum item visível
        document.querySelectorAll('.nav-group').forEach(g => {
          const temItemVisivel = Array.from(g.querySelectorAll('.nav-link')).some(a => a.style.display !== 'none');
          if (!temItemVisivel) g.style.display = 'none';
        });
      }
      // Abrir/fechar submenu por clique (alem do hover), e fechar ao clicar fora
      document.querySelectorAll('.nav-group-label').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const grupo = btn.closest('.nav-group');
          const jaAberto = grupo.classList.contains('open');
          document.querySelectorAll('.nav-group.open').forEach(g => g.classList.remove('open'));
          if (!jaAberto) grupo.classList.add('open');
        });
      });
      document.addEventListener('click', () => {
        document.querySelectorAll('.nav-group.open').forEach(g => g.classList.remove('open'));
      });
      // Mostrar usuario no nav
      document.getElementById('nav-user').innerHTML = `
        <img src="${user.photoURL || ''}" style="width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);" onerror="this.style.display='none'">
        <span style="color:rgba(255,255,255,0.85);font-size:0.82em;">${user.displayName || user.email}</span>
        <button onclick="firebase.auth().signOut().then(()=>window.location.href='/login.html')" style="background:rgba(255,255,255,0.15);border:none;color:white;padding:5px 12px;border-radius:6px;font-size:0.78em;cursor:pointer;font-weight:600;">Sair</button>
      `;
      // Perfil carregado - iniciar rota
      window._perfilCarregado = true;
      // Preload dados em background para navegação mais rápida
      API.getProcessos().catch(()=>{});
      API.getAreas().catch(()=>{});
      API.getDependencias().catch(()=>{});
      if (window._routePendente) route();
    });
  </script>
  <script src="app.js?v=82"></script>
</body>
</html>
